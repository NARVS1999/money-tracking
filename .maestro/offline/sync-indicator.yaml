# Sync Indicator
# Tests that the SyncButton appears and shows correct state

appId: com.ampolnarvs.mtscaffold
---
- launchApp
- waitForAnimationToEnd

# The SyncButton should be visible in the header
# It appears on all tabs as headerRight in MainTabs
- assertVisible:
    text: "Sync"
    optional: true

# OR check for sync icon (Ionicons sync-outline)
# The SyncButton component renders an icon, not text
# So we verify the header area has the sync control

# Navigate through tabs to verify SyncButton is persistent
- tapOn:
    text: "Expenses"

- waitForAnimationToEnd

# SyncButton should still be visible (it's in the header)
- assertVisible:
    text: "Sync"
    optional: true

- tapOn:
    text: "Income"

- waitForAnimationToEnd

- assertVisible:
    text: "Sync"
    optional: true
